<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="'PingFang SC','Microsoft YaHei',-apple-system,Segoe UI,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef6f4"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c0392b"/>
      <stop offset="1" stop-color="#e74c3c"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .lbl{fill:#0f172a;font-size:13px;font-weight:600}
      .sub{fill:#64748b;font-size:10.5px}
      .t{fill:#fff;font-size:13px;font-weight:700}
      .cap{fill:#475569;font-size:12px;font-weight:700}
    </style>
  </defs>

  <rect width="920" height="470" fill="url(#bg)"/>

  <!-- title -->
  <rect x="0" y="0" width="920" height="46" fill="url(#brand)"/>
  <text x="24" y="30" class="t" font-size="16">朱雀 API 网关 · 架构总览</text>
  <text x="896" y="30" text-anchor="end" fill="#ffe3df" font-size="11">script → API in one click</text>

  <!-- zones -->
  <text x="70" y="80" class="cap">外部 / API 调用方</text>
  <text x="380" y="80" class="cap">平台（朱雀网关）</text>
  <text x="720" y="80" class="cap">脚本运行时</text>

  <!-- caller -->
  <rect class="box" x="24" y="96" width="150" height="58" rx="10"/>
  <text x="44" y="124" class="lbl">API 调用方</text>
  <text x="44" y="142" class="sub">curl / 前端 / 第三方</text>

  <!-- public endpoint -->
  <rect x="24" y="186" width="150" height="58" rx="10" fill="#fff4f1" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="44" y="214" class="lbl" fill="#c0392b">/api/run/{slug}</text>
  <text x="44" y="232" class="sub">X-API-Key 鉴权</text>

  <!-- web panel -->
  <rect class="box" x="300" y="96" width="170" height="58" rx="10"/>
  <text x="320" y="124" class="lbl">Web 管理面板</text>
  <text x="320" y="142" class="sub">React 18 · Vite · Arco</text>

  <!-- fastapi core -->
  <rect x="300" y="186" width="170" height="92" rx="10" fill="url(#dark)"/>
  <text x="320" y="212" class="t">FastAPI 网关</text>
  <text x="320" y="232" class="lbl" fill="#cbd5e1" font-size="10.5">· 鉴权 · 限流 · 并发</text>
  <text x="320" y="248" class="lbl" fill="#cbd5e1" font-size="10.5">· IP 守卫 · 调用日志</text>
  <text x="320" y="264" class="lbl" fill="#cbd5e1" font-size="10.5">· 设置 / 镜像源</text>

  <!-- executor -->
  <rect class="box" x="640" y="186" width="160" height="58" rx="10"/>
  <text x="660" y="214" class="lbl">脚本执行引擎</text>
  <text x="660" y="232" class="sub">executor · stdin/ENV</text>

  <!-- scripts -->
  <rect x="640" y="276" width="160" height="58" rx="10" fill="#fff4f1" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="660" y="304" class="lbl" fill="#c0392b">你的脚本 .py / .js</text>
  <text x="660" y="322" class="sub">stdout JSON = 响应</text>

  <!-- bottom platform modules -->
  <rect class="box" x="300" y="300" width="80" height="40" rx="8"/>
  <text x="318" y="325" class="lbl" font-size="11">SQLite</text>
  <rect class="box" x="392" y="300" width="80" height="40" rx="8"/>
  <text x="408" y="325" class="lbl" font-size="11">文件管理</text>
  <rect class="box" x="484" y="300" width="80" height="40" rx="8"/>
  <text x="500" y="325" class="lbl" font-size="11">SSH 终端</text>

  <!-- arrows -->
  <line x1="99" y1="154" x2="99" y2="184" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="174" y1="215" x2="298" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="385" y1="154" x2="385" y2="184" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="232" x2="638" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="244" x2="720" y2="274" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="385" y1="278" x2="385" y2="298" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M385,340 C385,366 99,366 99,300" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <text x="24" y="456" class="sub">请求：调用方 → /api/run → 网关守卫 → 执行脚本 → 回显 JSON　|　管理：浏览器 → 面板 → 网关 → 数据/脚本</text>
</svg>
